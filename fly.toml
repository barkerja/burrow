# fly.toml app configuration file generated for burrow on 2025-12-12T23:44:50-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# Required secrets (set via `fly secrets set`):
#   DATABASE_URL          - PostgreSQL connection string
#   SECRET_KEY_BASE       - Phoenix secret (generate: mix phx.gen.secret)
#   BURROW_DOMAIN         - Base domain for tunnels (e.g. tunnel.example.com)
#
# Optional secrets:
#   LIVE_VIEW_SALT        - LiveView signing salt (generate: mix phx.gen.secret)
#   ACME_EMAIL            - Let's Encrypt registration email
#   ACME_DOMAINS          - Comma-separated domains for TLS certs
#   CLOUDFLARE_API_TOKEN  - DNS-01 challenge provider
#   CLOUDFLARE_ZONE_ID    - Cloudflare zone for DNS-01
#   GITHUB_CLIENT_ID      - Inspector OAuth (optional)
#   GITHUB_CLIENT_SECRET  - Inspector OAuth (optional)
#

app = 'burrow'
primary_region = 'ewr'

[env]
  DNS_CLUSTER_QUERY = "burrow.internal"
  FLY_APP_NAME = "burrow"

[build]

[deploy]
  release_command = "/app/bin/burrow eval 'Burrow.Release.migrate()'"

[http_service]
  internal_port = 443
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

# TCP tunnel ports (40000-40019 = 20 concurrent TCP tunnels)
# Using handlers = [] for raw TCP pass-through
# Each port limited to 100 concurrent connections
[[services]]
  internal_port = 40000
  protocol = "tcp"
  [services.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80
  [[services.ports]]
    port = 40000
    handlers = []

